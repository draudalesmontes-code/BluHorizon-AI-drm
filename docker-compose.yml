services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: bluhorizon
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/database/blu_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./Backend/database/migrations/001_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./Backend/database/migrations/002_constraints.sql:/docker-entrypoint-initdb.d/03_constraints.sql
      - ./Backend/database/migrations/003_cascades.sql:/docker-entrypoint-initdb.d/04_cascades.sql
      - ./Backend/database/migrations/004_triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql
      - ./Backend/database/migrations/005_vector_column.sql:/docker-entrypoint-initdb.d/06_vector_column.sql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/faiss_data:/app/faiss_data
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace_me}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-replace_me}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:local_dev_password@db:5432/bluhorizon}
      SECRET_KEY: ${SECRET_KEY:-replace_me_with_any_long_random_string}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      FAISS_INDEX_PATH: ${FAISS_INDEX_PATH:-./faiss_data}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8000
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
